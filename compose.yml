services:

  postgres:
    image: postgres:17
    container_name: propfinder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: propfinder
      POSTGRES_USER: propfinder
      POSTGRES_PASSWORD: propfinder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:4.3.1
    container_name: propfinder-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    container_name: propfinder-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  redis:
    image: redis:latest
    container_name: propfinder-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  kafka_data:
  elasticsearch_data:
  redis_data: